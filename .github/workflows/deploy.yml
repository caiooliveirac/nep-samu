# Deploy do NEP SAMU — roda NO magalu, via runner self-hosted (label `nep`).
# A EC2 foi encerrada em julho/2026: nenhum passo aqui pode voltar a apontar
# para ela. Sem secrets de SSH, sem host remoto — o runner já está dentro do
# servidor de destino.
#
# Mesmo padrão validate → deploy dos outros apps (ex.: plantoes): um job
# isolado, hospedado, roda lint/typecheck/testes/build antes de soltar o
# self-hosted em cima da produção. Diferente do plantoes, não há passo de
# SSH aqui — o runner self-hosted já é o próprio servidor — e o job de
# validate não mexe em banco nenhum (ver nota no fim do arquivo).
name: Deploy NEP SAMU (magalu)

on:
  push:
    branches: [main]
  workflow_dispatch:

# um deploy por vez; cancelar no meio de um build deixa o pm2 servindo um
# .next pela metade
concurrency:
  group: deploy-nep-samu
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (next typegen + tsc)
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Publicar em mnrs.com.br/NEP
    needs: validate
    runs-on: [self-hosted, nep]
    steps:
      - name: Atualizar, construir e reiniciar
        run: |
          set -euo pipefail

          APP_DIR=/home/ubuntu/nep-samu
          cd "$APP_DIR"

          # commit atual, para voltar se o novo não subir
          ANTERIOR=$(git rev-parse HEAD)
          echo "commit atual: $ANTERIOR"

          publicar() {
            git fetch --quiet origin main
            git reset --quiet --hard "$1"
            pnpm install --frozen-lockfile
            pnpm build
            # o standalone não copia estáticos nem public: é passo obrigatório
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public 2>/dev/null || true
            # o .env vive só no servidor (600) e nunca entra no repositório
            cp .env .next/standalone/.env
            pm2 restart nep-samu --update-env || pm2 start ecosystem.config.js --only nep-samu
          }

          publicar "origin/main"

          # health check: se o app não responder, volta ao commit anterior
          ok=""
          for i in $(seq 1 10); do
            sleep 3
            if curl -fsS -o /dev/null http://127.0.0.1:3062/NEP/api/health; then ok=1; break; fi
          done

          if [ -z "$ok" ]; then
            echo "::error::health check falhou — voltando para $ANTERIOR"
            publicar "$ANTERIOR"
            pm2 save
            exit 1
          fi

          pm2 save
          echo "deploy concluído — $(git rev-parse --short HEAD) em 127.0.0.1:3062, público em https://mnrs.com.br/NEP"

# Esquema do banco: nenhum passo automático. O banco de produção veio do dump
# da EC2 e tem dado real; sincronizar esquema sem revisão apaga coluna sem
# aviso. Quando o esquema mudar, aplicar a mão, com backup antes.
